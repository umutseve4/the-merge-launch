name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a running one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages_enabled: ${{ steps.pages_state.outputs.enabled }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Nothing is published unless the same gate that guards main passes.
      - name: Run the quality gate before publishing
        run: python scripts/validate_site.py

      # And that gate has to prove it is still capable of failing, otherwise
      # "the checks passed" is a sentence about nothing.
      - name: Prove the gate can fail
        run: python scripts/mutation_check.py

      # Pages cannot be switched on from a workflow: configure-pages with
      # enablement: true needs admin rights the default GITHUB_TOKEN does not
      # have, and it fails hard when Pages is off. That turns every run red for
      # a reason that has nothing to do with the code, which is exactly the kind
      # of noise that teaches people to ignore a red X.
      #
      # So the workflow asks first, and reports instead of failing.
      - name: Is Pages switched on?
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            # A green run must never be mistaken for a published site. The job
            # succeeded, the checks really did pass, but nothing was deployed,
            # so it is annotated rather than left silently green.
            echo "::warning title=Site not published::The quality gate passed, but GitHub Pages is switched off, so nothing was deployed. Settings -> Pages -> Source: GitHub Actions, then re-run."
            {
              echo "### Pages is not switched on yet"
              echo ""
              echo "The site passed every check and is ready to publish, but GitHub"
              echo "Pages has no source configured, so there is nothing to deploy to."
              echo ""
              echo "**To publish:** Settings, Pages, Source: **GitHub Actions**, then"
              echo "re-run this workflow."
              echo ""
              echo "This is a one-time manual step; a workflow token is not allowed"
              echo "to do it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Pages
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      # The repository root is uploaded verbatim: there is no build step, so
      # what CI validated is byte-for-byte what visitors receive.
      - name: Upload site
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out the commit that was deployed
        uses: actions/checkout@v4

      # A successful deployment only proves the artifact was accepted by the
      # Pages service. This asks the public URL for the page and requires the
      # bytes it returns to be the bytes in this commit, so a green run cannot
      # mean a stale, empty or unreachable site.
      - name: Prove the live site serves this commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -uo pipefail
          expected="$(sha256sum index.html | cut -d' ' -f1)"
          echo "committed index.html sha256: $expected"
          for attempt in $(seq 1 12); do
            code="$(curl -sS -L -o /tmp/live.html -w '%{http_code}' "$PAGE_URL" || echo 000)"
            served="$(sha256sum /tmp/live.html | cut -d' ' -f1)"
            echo "attempt $attempt: HTTP $code, served sha256 $served"
            if [ "$code" = "200" ] && [ "$served" = "$expected" ]; then
              {
                echo "### Live site verified"
                echo ""
                echo "- URL: $PAGE_URL"
                echo "- HTTP status: 200"
                echo "- Served bytes match the committed index.html (sha256 $expected)"
                echo "- Commit: $GITHUB_SHA"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "PASS: the live URL returns exactly the bytes that passed the gate."
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Live site did not match::The deployment reported success but $PAGE_URL never returned the committed bytes."
          exit 1
