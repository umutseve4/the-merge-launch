name: Static QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The assertions live in scripts/validate_site.py so this gate and the
      # publish gate run the identical checks instead of two copies that drift.
      - name: Parse and validate the self-contained page
        run: python scripts/validate_site.py
